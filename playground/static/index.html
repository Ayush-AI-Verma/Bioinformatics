<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Kev Playground</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2f3a;
    --text: #e6e9ef; --dim: #9aa3b2; --accent: #5b8cff;
    --yes: #3fb950; --no: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, "SF Mono", Menlo, monospace;
  }
  header {
    display: flex; gap: 10px; align-items: end; flex-wrap: wrap;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    background: var(--panel); position: sticky; top: 0; z-index: 2;
  }
  header .brand { font-weight: 700; margin-right: 8px; font-size: 15px; }
  label { display: flex; flex-direction: column; gap: 4px; color: var(--dim); font-size: 11px; }
  input, select, textarea, button {
    background: #0d1017; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 9px; font: inherit; font-size: 13px;
  }
  textarea { width: 100%; min-height: 120px; resize: vertical; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0b1220; font-weight: 700; }
  button:disabled { opacity: .5; cursor: default; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 18px; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .panel h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
  .row { display: flex; gap: 8px; align-items: center; }
  .mode-switch { display: flex; gap: 4px; }
  .mode-switch button[aria-pressed="true"] { border-color: var(--accent); color: var(--text); }
  .pipeline-example { margin-top: 8px; }
  .pipeline-step { margin-top: 12px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; }
  .pipeline-step h3 { margin: 0 0 8px; font-size: 14px; }
  .pipeline-tools { display: grid; gap: 8px; margin-top: 8px; }
  .pipeline-tool { padding: 8px; border: 1px solid var(--border); border-radius: 6px; }
  .pipeline-tool p { margin: 4px 0; }
  .pipeline-tool code { overflow-wrap: anywhere; }
  .qrow { display: grid; grid-template-columns: 92px 1fr 1fr 30px; gap: 8px; margin-bottom: 8px; }
  .qrow input { width: 100%; }
  .qrow .del { padding: 4px 8px; color: var(--no); }
  #results .qa { padding: 10px 0; border-top: 1px solid var(--border); }
  .qa .instr { color: var(--text); margin-bottom: 6px; }
  .qa .meta { color: var(--dim); font-size: 11px; margin-bottom: 6px; }
  .bar { display: grid; grid-template-columns: 160px 1fr 64px; gap: 8px; align-items: center; margin: 3px 0; }
  .bar .name { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .track { background: #0d1017; border: 1px solid var(--border); border-radius: 4px; height: 16px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--accent); }
  .bar .fill.yes { background: var(--yes); }
  .bar .fill.no { background: var(--no); }
  .bar .fill.top { background: var(--yes); }
  .bar .p { text-align: right; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 8px; font-size: 11px; margin-left: 8px; }
  .badge.yes { background: rgba(63,185,80,.15); color: var(--yes); border: 1px solid var(--yes); }
  .badge.no { background: rgba(248,81,73,.15); color: var(--no); border: 1px solid var(--no); }
  .err { color: var(--no); white-space: pre-wrap; }
  .dim { color: var(--dim); font-size: 12px; }
  a.mlink { color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent); }
  a.mlink:hover { text-decoration: underline; }
  #status { margin-left: auto; color: var(--dim); align-self: center; }
</style>
</head>
<body>
<header>
  <span class="brand">kev playground</span>
  <label>Endpoint
    <input id="baseUrl" style="width:300px" value="https://ayush-ai-verma--kev27b-api.modal.run" />
  </label>
  <label>Model
    <select id="model" style="width:140px">
      <option value="kev-27b" selected>kev-27b</option>
      <option value="kev-9b">kev-9b</option>
      <option value="kev-latest">kev-latest (local)</option>
    </select>
  </label>
  <label>API key (optional)
    <input id="apiKey" type="password" style="width:180px" placeholder="Bearer key" />
  </label>
  <button id="run" class="primary">Run</button>
  <span id="status"></span>
</header>

<main>
  <section class="panel">
    <h2>Document</h2>
    <div class="row" style="margin-bottom:8px">
      <select id="docPreset">
        <option value="">Load a preset…</option>
        <option value="safe">Safe kitchen</option>
        <option value="safeDetailed">Safe kitchen (detailed)</option>
        <option value="unsafe">Unsafe kitchen</option>
        <option value="bioScientist">Bioinformatics scientist</option>
      </select>
      <button id="clearDoc">Clear</button>
    </div>
    <textarea id="doc" placeholder="Paste the text Kev should read…"></textarea>

    <h2 style="margin-top:16px">Questions</h2>
    <div id="questions"></div>
    <div class="row">
      <button id="addQ">+ Add question</button>
      <button id="loadKitchen">Load kitchen-safety 20</button>
      <button id="loadScientist">Load scientist-profile 15</button>
      <button id="clearQ">Clear questions</button>
    </div>
    <p class="dim">Types: yes/no → a probability; choice → comma-separated options;
      score → comma-separated levels, low to high.</p>
  </section>

  <section class="panel" style="grid-column: 1 / -1" id="keyPanel">
    <h2>Model finder — which bioinformatics model fits your task?</h2>
    <div class="row" style="margin-bottom:8px">
      <input id="taskText" style="flex:1" placeholder='Describe your task, e.g. "score mutation effects in a protein family" or "annotate cell types in my scRNA-seq data"' />
      <div class="mode-switch" role="group" aria-label="Recommendation mode">
        <button id="modeSingle" type="button" aria-pressed="true">Single</button>
        <button id="modePipeline" type="button" aria-pressed="false">Pipeline</button>
      </div>
      <button id="runKey" class="primary">Identify</button>
    </div>
    <div class="row pipeline-example">
      <button id="pipelineExample" type="button">Pipeline: Assemble a bacterial genome from nanopore reads, find its biosynthetic gene clusters, then dock the predicted products against a target protein</button>
    </div>
    <div id="keyPath"></div>
  </section>

  <section class="panel" id="resultPanel">
    <h2>Results</h2>
    <div id="usage" class="dim"></div>
    <div id="results"><span class="dim">Run to see answers.</span></div>
  </section>
</main>

f of the fridge, well away from the salad and other ready-to-eat food, and I use a separate red cutting board just for raw meat so nothing cross-contaminates. Once we finish eating I'll put the leftovers in shallow containers and into the fridge within the hour, well inside the two-hour window where bacteria multiply fastest. A small splash of water by the counter got wiped up the moment it happened — a wet tile floor and someone carrying a hot pan is a bad combination. The toaster and kettle cords are routed along the back of the counter, away from the sink and any hot surface. My kids and the dog are in the living room; the rule is nobody under four feet tall or four legs in the cooking zone while the stove is on. The floor is dry and clear — no bags, boxes, or toys I could trip over while carrying something hot. And I know exactly where the fire extinguisher is: mounted on the wall by the pantry door, checked last year, pin still in.`;

const BIO_SCIENTIST = `I'm a computational biologist at a mid-size research institute, splitting my week between the wet lab and a small GPU workstation. My main system is Escherichia coli — I engineer strains for metabolic work and study antibiotic resistance evolution — but I also handle Enterococcus isolates from a hospital collaboration and occasional environmental metagenomic samples from wastewater. On the protein side, I work on enzyme engineering: I use AlphaFold2 through ColabFold for routine folding of single sequences, Boltz-1 on our local GPU when I need protein-ligand or complex structures (we keep everything on-prem because of hospital data agreements), and ESM-2 for zero-shot variant-effect scoring when I'm triaging mutation libraries before ordering oligos. For anything high-value I sanity-check with SaProt since we cache AF2 structures for the strains we study. On the sequence side, I use DNABERT-2 embeddings for promoter classification in E. coli, and I've been testing Nucleotide Transformer when a project crosses into other species. For differential expression on bulk RNA-seq I just run DESeq2 — it's the right tool, no reason to be clever. Our single-cell work goes through scFoundation for annotation and imputation, with scVI as the classical baseline I trust for integration. When microscopy comes up, the imaging core runs Cellpose for segmentation and I do downstream spatial stats in Squidpy. Metagenomic reads go through Kraken2 for taxonomic profiling, then I do functional analysis downstream. My pipelines are Nextflow on a Slurm cluster, sequence search is still HMMER and BLAST against UniRef50, and for literature mining I run PubMedBERT-based NER over new papers weekly. For decision-type questions — is this sample contaminated, does this email need my PI, is this result plausible — I've been experimenting with Kev as a scoring layer. What I don't do: clinical diagnostics, medical imaging, or anything patient-facing; our work is research-grade only. Main current challenges: predicting which resistance mutations will actually fix in a population, designing a thermostable variant of a plastic-degrading enzyme, and figuring out why one transporter cluster keeps showing up in wastewater samples.`;

const questionsEl = document.getElementById("questions");

function addQuestion(instr = "", type = "noul", criteria = "") {
  const row = document.createElement("div");
  row.className = "qrow";
  row.innerHTML = `
    <select class="qtype">
      <option value="noul">yes / no</option>
      <option value="choice">choice</option>
      <option value="score">score</option>
    </select>
    <input class="qinstr" placeholder="Question…" />
    <input class="qcrit" placeholder="options / levels, comma-separated" />
    <button class="del" title="Remove">✕</button>`;
  row.querySelector(".qtype").value = type;
  row.querySelector(".qinstr").value = instr;
  row.querySelector(".qcrit").value = criteria;
  row.querySelector(".del").onclick = () => row.remove();
  const crit = row.querySelector(".qcrit");
  row.querySelector(".qtype").onchange = e => {
    crit.style.display = e.target.value === "noul" ? "none" : "";
  };
  crit.style.display = type === "noul" ? "none" : "";
  questionsEl.appendChild(row);
}

document.getElementById("addQ").onclick = () => addQuestion();
document.getElementById("clearQ").onclick = () => { questionsEl.innerHTML = ""; };
document.getElementById("clearDoc").onclick = () => { document.getElementById("doc").value = ""; };
document.getElementById("docPreset").onchange = e => {
  if (e.target.value === "safe") document.getElementById("doc").value = SAFE;
  if (e.target.value === "safeDetailed") document.getElementById("doc").value = SAFE_DETAILED;
  if (e.target.value === "unsafe") document.getElementById("doc").value = UNSAFE;
  if (e.target.value === "bioScientist") document.getElementById("doc").value = BIO_SCIENTIST;
  e.target.value = "";
};
document.getElementById("loadKitchen").onclick = () => {
  questionsEl.innerHTML = "";
  KITCHEN_QUESTIONS.forEach(q => addQuestion(q));
};
document.getElementById("loadScientist").onclick = () => {
  questionsEl.innerHTML = "";
  SCIENTIST_QUESTIONS.forEach(([q, t, c]) => addQuestion(q, t, c));
};

function collectQuestions() {
  const out = {};
  let i = 0;
  collectQuestions.bad = 0;
  for (const row of questionsEl.children) {
    row.style.outline = "";
    const type = row.querySelector(".qtype").value;
    const instructions = row.querySelector(".qinstr").value.trim();
    if (!instructions) continue;
    const q = { type, instructions };
    const crit = row.querySelector(".qcrit").value.split(",").map(s => s.trim()).filter(Boolean);
    if (type === "choice" || (type === "score" && !crit.length && looksLikeModelPick(instructions))) {
      const opts = crit.length ? Object.fromEntries(crit.map(o => [o, null])) : catalogFor(instructions);
      if (!Object.keys(opts).length) { row.style.outline = "1px solid var(--no)"; collectQuestions.bad++; continue; }
      q.type = "choice";
      q.criteria = opts;
      q._pick = !crit.length;
    } else if (type === "score") {
      q.criteria = crit.length ? crit : ["low", "medium", "high"];
    }
    out["q" + ++i] = q;
  }
  return out;
}
collectQuestions.bad = 0;

function looksLikeModelPick(s) {
  return /\b(best|which|what|where|recommend|appropriate|pick|choose|tool|model|database|resource|site|search|lookup)\b/i.test(s);
}

function linkModel(name) {
  const url = MODEL_LINKS[name];
  const label = core.esc(name);
  return url ? `<a class="mlink" href="${core.esc(core.safeUrl(url))}" target="_blank" rel="noopener">${label} ↗</a>` : label;
}
function catalogFor(s) {
  const t = s.toLowerCase();
  if (/database|resource|site|lookup|look up|find existing|catalog|ncbi|uniprot|refseq|foldseek|pdb|homolog|blast|accession|antismash|mibig|bgc|secondary metabol|natural product/.test(t)) return CATALOGS.databases_lookup;
  if (/struct|fold|3d|dock|ligand|complex/.test(t)) return CATALOGS.structure;
  if (/mutat|variant|embed|protein lm|function|design/.test(t)) return CATALOGS.protein_lm;
  if (/dna|genom|promot|enhanc|rna sequence/.test(t)) return CATALOGS.genomics;
  if (/single.?cell|scrna/.test(t)) return CATALOGS.single_cell;
  return CATALOGS.general;
}

function bar(name, p, cls = "") {
  const pct = Math.round(p * 1000) / 10;
  return `<div class="bar"><span class="name">${linkModel(name)}</span>
    <span class="track"><span class="fill ${cls}" style="width:${pct}%"></span></span>
    <span class="p">${p.toFixed(3)}</span></div>`;
}

function renderAnswer(name, q, a) {
  let html = `<div class="qa"><div class="instr">${core.esc(q.instructions)}</div>`;
  if (a.type === "noul") {
    const yes = a.noul >= 0.5;
    html += `<div class="meta">yes/no <span class="badge ${yes ? "yes" : "no"}">${yes ? "YES" : "NO"}</span></div>`;
    html += bar("yes", a.noul, "yes");
    html += bar("no", 1 - a.noul, "no");
  } else if (a.type === "choice") {
    const sorted = Object.entries(a.probabilities || {}).sort((x, y) => y[1] - x[1]);
    if (q._pick && sorted.length >= 2) {
      const [best, ...rest] = sorted;
      const backups = rest.slice(0, 3).map(([k, p]) => `${linkModel(k)} (${p.toFixed(2)})`).join(", ");
      const desc = (q.criteria && q.criteria[best[0]]) || "";
      html += `<div class="meta">best pick → <b>${linkModel(best[0])}</b> (${best[1].toFixed(2)})` +
        (desc ? ` — ${core.esc(desc)}` : "") + `<br>backups → ${backups}</div>`;
    } else {
      html += `<div class="meta">choice → <b>${linkModel(a.choice)}</b> · confidence ${(a.confidence ?? 0).toFixed(3)}</div>`;
    }
    for (const [opt, p] of sorted)
      html += bar(opt, p, opt === a.choice ? "top" : "");
  } else if (a.type === "score") {
    html += `<div class="meta">score → <b>${core.esc(a.score)}</b> · confidence ${(a.confidence ?? 0).toFixed(3)}</div>`;
    const legend = a.legend || {};
    const probs = a.probabilities || {};
    const top = Object.keys(probs).reduce((m, k) => probs[k] > probs[m] ? k : m, Object.keys(probs)[0]);
    for (const [k, p] of Object.entries(probs))
      html += bar(legend[k] ?? k, p, k === top ? "top" : "");
  } else {
    html += `<pre class="dim">${core.esc(JSON.stringify(a, null, 2))}</pre>`;
  }
  return html + "</div>";
}

document.getElementById("run").onclick = async () => {
  const questions = collectQuestions();
  const status = document.getElementById("status");
  const results = document.getElementById("results");
  if (!Object.keys(questions).length) {
    status.textContent = collectQuestions.bad
      ? "choice questions need options — fill the third field (comma-separated)"
      : "add at least one question";
    return;
  }
  if (collectQuestions.bad)
    status.textContent = `${collectQuestions.bad} choice question(s) skipped — need options`;
  document.getElementById("run").disabled = true;
  status.textContent = "running…";
  results.innerHTML = "";
  document.getElementById("usage").textContent = "";
  try {
    const r = await fetch("/api/ask", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        base_url: document.getElementById("baseUrl").value,
        model: document.getElementById("model").value,
        api_key: document.getElementById("apiKey").value || null,
        state: document.getElementById("doc").value,
        questions,
      }),
    });
    const data = await r.json();
    if (data.error) { results.innerHTML = `<div class="err">${data.error}</div>`; status.textContent = "error"; return; }
    const qlist = Object.entries(questions);
    results.innerHTML = qlist.map(([name, q]) =>
      data.answers[name] ? renderAnswer(name, q, data.answers[name]) : ""
    ).join("");
    const u = data.usage || {};
    document.getElementById("usage").textContent =
      `${qlist.length} questions · ${u.input_tokens ?? "?"} in / ${u.output_tokens ?? "?"} out tokens · ${Math.round(data.latency_ms ?? 0)} ms model time`;
    status.textContent = "done";
  } catch (e) {
    results.innerHTML = `<div class="err">${e}</div>`;
    status.textContent = "error";
  } finally {
    document.getElementById("run").disabled = false;
  }
};

async function askOne(state, name, q) {
  const r = await fetch("/api/ask", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({
      base_url: document.getElementById("baseUrl").value,
      model: document.getElementById("model").value,
      api_key: document.getElementById("apiKey").value || null,
      state, questions: { [name]: q },
    }),
  });
  const data = await r.json();
  if (data.error) throw new Error(data.error);
  return data.answers[name];
}

async function askQuestions(state, questions) {
  const r = await fetch("/api/ask", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({
      base_url: document.getElementById("baseUrl").value,
      model: document.getElementById("model").value,
      api_key: document.getElementById("apiKey").value || null,
      state,
      questions,
    }),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `Kev request failed (${r.status})`);
  if (data.error) throw new Error(data.error);
  if (!data.answers) throw new Error("Kev response did not include answers.");
  return data.answers;
}

async function loadTools() {
  const r = await fetch("/tools.json");
  const tools = await r.json().catch(() => null);
  if (!r.ok || !Array.isArray(tools)) throw new Error("Could not load the bioinformatics tool catalog.");
  return tools;
}

async function walkTree(state, onStep) {
  let node = KEY_TREE;
  let step = 1;
  while (!node.leaf) {
    const q = node.ask;
    const a = await askOne(state, "step", q);
    let answerText;
    let detail;
    if (q.type === "noul") {
      const yes = a.noul >= (node.thresh ?? 0.5);
      answerText = yes ? "yes" : "no";
      detail = a.noul.toFixed(3);
      node = yes ? node.yes : node.no;
    } else {
      answerText = a.choice;
      detail = (a.probabilities[a.choice] ?? 0).toFixed(3);
      node = node.next[answerText];
    }
    onStep?.({ q, answerText, detail, step: step++, node });
    if (!node) break;
  }
  return node;
}

function renderPipelineStep({ stage, leaf, tools }, index) {
  const esc = core.esc;
  const model = leaf?.model;
  const needsModel = model && model !== "Not a bioinformatics task";
  const candidates = (leaf?.cands || [])
    .filter((candidate) => candidate[0] !== model)
    .map(([name, description]) => `<li><b>${esc(name)}</b>${description ? ` — ${esc(description)}` : ""}</li>`)
    .join("");
  const resources = (leaf?.resources || [])
    .map((resource) => `<span class="badge">${esc(resource)}</span>`)
    .join("");
  const toolCards = tools.map(({ tool, p }) => {
    const url = core.safeUrl(tool.url);
    const name = url && url !== "#"
      ? `<a class="mlink" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(tool.name)} ↗</a>`
      : esc(tool.name);
    return `<div class="pipeline-tool">
      <div><b>${name}</b> <span class="badge">${Math.round(p * 100)}% Kev</span></div>
      <p>${esc(tool.description)}</p>
      <div class="dim">Install: <code>${esc(tool.install || "No install command listed")}</code></div>
    </div>`;
  }).join("");
  const modelHtml = needsModel
    ? `<div><b>Recommended model: ${esc(model)}</b></div><p>${esc(leaf.blurb || "")}</p>
       ${candidates ? `<div class="meta"><b>Alternatives</b><ul>${candidates}</ul></div>` : ""}`
    : `<div><b>No ML model needed for this step</b></div>`;
  return `<article class="pipeline-step">
    <h3>Step ${index + 1} · ${esc(stage.category)} · Kev ${Math.round(stage.p * 100)}%</h3>
    <div>${modelHtml}</div>
    <div class="meta" style="margin-top:8px"><b>Top catalog tools</b></div>
    <div class="pipeline-tools">${toolCards || `<div class="dim">Kev returned no tool probabilities for this step.</div>`}</div>
    ${resources ? `<div class="meta" style="margin-top:8px"><b>Resources</b> ${resources}</div>` : ""}
  </article>`;
}

async function runPipeline(state, out) {
  out.innerHTML = '<div id="pipelineProgress" class="dim">Finding steps…</div>';
  const [stageAnswers, tools] = await Promise.all([
    askQuestions(state, pipeline.stageQuestions(core.STAGE_ORDER)),
    loadTools(),
  ]);
  const stages = pipeline.pickStages(stageAnswers, core.STAGE_ORDER);
  if (!stages.length) throw new Error("Kev did not identify any pipeline steps.");

  out.innerHTML = `<div id="pipelineProgress" class="dim">Step 1/${stages.length}…</div><div id="pipelineResults"></div>`;
  let completed = 0;
  const results = await Promise.all(stages.map(async (stage) => {
    const stepState = pipeline.stepState(state, stage.category);
    const [toolAnswers, leaf] = await Promise.all([
      askQuestions(stepState, pipeline.toolQuestion(stage.category, tools)),
      walkTree(stepState),
    ]);
    if (!leaf) throw new Error(`The model decision tree returned no leaf for ${stage.category}.`);
    completed += 1;
    const progress = document.getElementById("pipelineProgress");
    if (progress) {
      progress.textContent = completed < stages.length
        ? `Step ${completed + 1}/${stages.length}…`
        : `Rendering ${stages.length} steps…`;
    }
    return {
      stage,
      leaf,
      tools: pipeline.topTools(toolAnswers[core.slug(stage.category)], tools, 3),
    };
  }));
  const resultsEl = document.getElementById("pipelineResults");
  if (resultsEl) resultsEl.innerHTML = results.map(renderPipelineStep).join("");
  const progress = document.getElementById("pipelineProgress");
  if (progress) progress.textContent = `${stages.length} steps complete`;
}

document.getElementById("runKey").onclick = async () => {
  const taskOnly = document.getElementById("taskText").value.trim();
  const docText = document.getElementById("doc").value.trim();
  const state = [docText, taskOnly].filter(Boolean).join("\n\nTask: ");
  const out = document.getElementById("keyPath");
  const btn = document.getElementById("runKey");
  if (!state) { out.innerHTML = '<span class="dim">Describe your task (or load a document above) first.</span>'; return; }
  btn.disabled = true;
  out.innerHTML = '<span class="dim">running (first call to 27B may take ~3 min if the GPU is cold)…</span>';
  try {
    if (document.getElementById("modePipeline").getAttribute("aria-pressed") === "true") {
      await runPipeline(state, out);
      return;
    }
    out.innerHTML = "";
    const node = await walkTree(state, ({ q, answerText, detail, step, node: nextNode }) => {
      out.innerHTML += `<div class="qa"><span class="dim">step ${step}:</span> ` +
        `${core.esc(q.instructions)} → <b>${core.esc(answerText)}</b> <span class="dim">(${core.esc(detail)})</span></div>`;
      if (!nextNode) out.innerHTML += `<div class="err">key fell off the path — no branch for "${core.esc(answerText)}"</div>`;
    });
    if (!node) return;
    let ranked = "";
    let headlineModel = node.model;
    let headlineBlurb = node.blurb;
    const seen = new Set();
    const allCands = [
      ...(node.cands || []),
      ...((node.resources || []).map(r => [r, RESOURCE_DESC[r] || "biological database / search resource"])),
    ].filter(([name]) => (seen.has(name) ? false : (seen.add(name), true)));
    if (allCands.length) {
      const qs = {};
      allCands.forEach(([name, desc], i) => {
        qs["cand" + i] = { type: "score",
          instructions: `How useful is ${name} for the user's task? (${desc})`,
          criteria: ["not needed", "helpful reference", "good fit", "essential"] };
      });
      const r = await fetch("/api/ask", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          base_url: document.getElementById("baseUrl").value,
          model: document.getElementById("model").value,
          api_key: document.getElementById("apiKey").value || null,
          state, questions: qs,
        }),
      });
      const data = await r.json();
      if (!data.error) {
        const scored = allCands.map(([name, desc], i) => {
          const a = data.answers["cand" + i] || {};
          return { name, desc, score: a.score ?? 0 };
        }).sort((x, y) => y.score - x.score);
        const top = Math.max(...scored.map(s => s.score), 0.001);
        const [best, ...rest] = scored;
        const leafEntry = scored.find(s => s.name === node.model);
        if (best && (!leafEntry || best.score > leafEntry.score + 0.25)) {
          headlineModel = best.name;
          headlineBlurb = `${best.desc} (promoted over ${node.model} because Kev scored it higher for your task).`;
        }
        const backups = rest.slice(0, 4).map(s => `${linkModel(s.name)} (${s.score.toFixed(2)}/3)`).join(", ");
        ranked = `<div class="meta" style="margin-top:6px">` +
          `best scored → <b>${linkModel(best.name)}</b> (${best.score.toFixed(2)}/3)` +
          (backups ? ` · backups → ${backups}` : "") + `</div>` +
          scored.map(s => bar(s.name, s.score / 3, s.score === top ? "top" : "")).join("");
      }
    }
    const resLinks = (node.resources && node.resources.length)
      ? `<div class="meta" style="margin-top:8px">databases &amp; search tools → ` +
        node.resources.map(linkModel).join(" · ") + `</div>` : "";
    out.innerHTML += `<div class="qa"><div class="instr">Recommendation: ` +
      `<b>${linkModel(headlineModel)}</b></div><div class="dim">${headlineBlurb}</div>${ranked}${resLinks}` +
      `<div id="liveHits" class="meta" style="margin-top:10px">searching live NCBI / UniProt / PDB / AlphaFold DB records…</div></div>`;

    // Query live NCBI / UniProt / PDB / AlphaFold DB and have Kev rank the real hits
    const sr = await fetch("/api/search_resources", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ text: taskOnly || state }),
    }).then(r => r.json()).catch(() => ({ items: [] }));
    const hitsEl = document.getElementById("liveHits");
    if (sr.items && sr.items.length) {
      const hqs = {};
      sr.items.forEach((it, i) => {
        hqs["h" + i] = { type: "score",
          instructions: `How relevant is this database record to the user's task: "${it.summary}"?`,
          criteria: ["unrelated", "loosely related", "relevant", "direct match"] };
      });
      const hr = await fetch("/api/ask", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          base_url: document.getElementById("baseUrl").value,
          model: document.getElementById("model").value,
          api_key: document.getElementById("apiKey").value || null,
          state, questions: hqs,
        }),
      }).then(r => r.json()).catch(() => ({}));
      const rankedHits = sr.items.map((it, i) => ({
        ...it,
        score: (hr.answers && hr.answers["h" + i] && hr.answers["h" + i].score) ?? 0,
      })).sort((a, b) => b.score - a.score);
      const relevant = rankedHits.filter(it => it.score >= 0.75);
      const shown = relevant.length ? relevant : rankedHits.slice(0, 3);
      hitsEl.innerHTML = `<b>live records from NCBI / UniProt / PDB / AlphaFold DB</b> (query: <code>${sr.query}</code>, Kev-scored):` +
        shown.map(it => {
          const af = it.af_url ? ` · <a class="mlink" href="${it.af_url}" target="_blank" rel="noopener">AlphaFold 3D ↗</a>` : "";
          const cls = it.score >= 1.5 ? "yes" : "no";
          return `<div style="margin-top:4px"><span class="badge ${cls}">${it.score.toFixed(2)}/3</span> ` +
            `<b>[${it.source}]</b> <a class="mlink" href="${it.url}" target="_blank" rel="noopener">${it.title} ↗</a>${af}</div>`;
        }).join("");
    } else if (hitsEl) {
      hitsEl.textContent = "";
    }
  } catch (e) {
    out.innerHTML += `<div class="err">${core.esc(e?.message || e)}</div>`;
  } finally {
    btn.disabled = false;
  }
};

function setFinderMode(mode) {
  const pipelineMode = mode === "pipeline";
  document.getElementById("modeSingle").setAttribute("aria-pressed", String(!pipelineMode));
  document.getElementById("modePipeline").setAttribute("aria-pressed", String(pipelineMode));
  document.getElementById("runKey").textContent = pipelineMode ? "Plan pipeline" : "Identify";
}
document.getElementById("modeSingle").onclick = () => setFinderMode("single");
document.getElementById("modePipeline").onclick = () => setFinderMode("pipeline");
document.getElementById("pipelineExample").onclick = () => {
  document.getElementById("taskText").value = "Assemble a bacterial genome from nanopore reads, find its biosynthetic gene clusters, then dock the predicted products against a target protein";
  setFinderMode("pipeline");
};
